services:
  mysql:
    image: mysql:8.4
    container_name: pixelpaw-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pixelpaw_db
      MYSQL_USER: ${PW_DB_USER}
      MYSQL_PASSWORD: ${PW_DB_PASSWORD}
      TZ: Asia/Shanghai
    command: >-
      --default-time-zone=+08:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: pixelpaw-redis
    command: redis-server --appendonly yes --requirepass ${PW_REDIS_PASSWORD}
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${PW_REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
